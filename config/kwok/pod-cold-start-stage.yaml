# KWOK simulation only: this does not model image pulls, CUDA initialization, CNI,
# storage, or a real container runtime. The rendering script combines this with
# the required Node initialization and Pod deletion Stages.
---
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  # This is the only pod-ready Stage in the rendered Exp3 configuration, so an
  # immediate default Stage cannot race the delayed experiment Stage.
  name: pod-ready
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchLabels:
      gpu-lab/simulated-cold-start: "true"
    matchExpressions:
      - key: '.metadata.deletionTimestamp'
        operator: DoesNotExist
      - key: '.status.phase'
        operator: In
        values:
          - Pending
      - key: '.status.conditions.[] | select(.type == "Ready") | .status'
        operator: NotIn
        values:
          - "True"
  delay:
    durationMilliseconds: COLD_START_MIN_MS
    jitterDurationMilliseconds: COLD_START_MAX_MS
  next:
    statusTemplate: |
      {{ $now := Now }}
      conditions:
      - lastTransitionTime: {{ $now | Quote }}
        status: "True"
        type: Initialized
      - lastTransitionTime: {{ $now | Quote }}
        status: "True"
        type: Ready
      - lastTransitionTime: {{ $now | Quote }}
        status: "True"
        type: ContainersReady
      containerStatuses:
      {{ range .spec.containers }}
      - image: {{ .image | Quote }}
        name: {{ .name | Quote }}
        ready: true
        restartCount: 0
        state:
          running:
            startedAt: {{ $now | Quote }}
      {{ end }}
      phase: Running
      startTime: {{ $now | Quote }}
