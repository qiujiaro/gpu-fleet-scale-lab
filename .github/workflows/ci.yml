name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
  # NOTE: large-scale performance experiments (Exp1-3) are NOT part of the PR gate.
  # A 60s kwok smoke can be added later as a separate job (Day 9), with structural
  # assertions only (all scheduled) — no SLO numeric assertions (CI runners are noisy).
